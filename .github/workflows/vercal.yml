# Temporary (branch only, never merged): Freekonomist blogger second check on cheaper models with the keys that live here.
# Arut 2026-11-24: routine work goes to cheaper models. MODE=vercal compares models with stored Sonnet verdicts (no writes);
# MODE=veronly runs the second check on the whole history and uploads the updated store as an artifact.
name: vercal
on:
  push:
    branches: [claude/project-thread-if2p4j]
    paths: [".vercal/job.env", ".github/workflows/vercal.yml"]
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Model ids available to the keys (names only)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY || secrets.XAI_API_KE }}
        run: |
          curl -s https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI_API_KEY" | python3 -c "import json,sys;d=json.load(sys.stdin);print('openai:',sorted(m['id'] for m in d.get('data',[]) if any(x in m['id'] for x in ('mini','nano','gpt-5','gpt-4.1','gpt-6'))) or d)" || true
          curl -s https://api.x.ai/v1/models -H "Authorization: Bearer $XAI_API_KEY" | python3 -c "import json,sys;d=json.load(sys.stdin);print('xai:',sorted(m['id'] for m in d.get('data',[])) or d)" || true
      - name: Second check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY || secrets.XAI_API_KE }}
        working-directory: .vercal
        run: |
          set -a; . ./job.env; set +a
          export HIST_CAL_POSTS=$POSTS HIST_VER_MODEL=${VER_MODEL:-} HIST_VER_DAYS=${VER_DAYS:-45} HIST_VER_MAX=${VER_MAX:-120}
          if [ "$MODE" = vercal ]; then python3 history.py vercal "$MODELS"; else python3 history.py veronly; mkdir -p out; cp leaders_history_ideas.json out/; fi
      - uses: actions/upload-artifact@v4
        with: {name: vercal, path: .vercal/out/, if-no-files-found: ignore}
