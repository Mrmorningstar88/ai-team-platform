name: skew-test
on:
  push:
    paths: [.github/workflows/skew-test.yml, jev-test/skew.py]
  workflow_dispatch:
jobs:
  skew:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        coin: [BTC, ETH]
    steps:
      - uses: actions/checkout@v4
      - run: python3 jev-test/skew.py ${{ matrix.coin }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skew-${{ matrix.coin }}
          path: skew_*.json
