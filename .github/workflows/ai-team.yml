# AI team bridge (Arut 2026-11-13): Claude asks GPT-6 Astra (design, animation, images) with the OpenAI key kept in
# this repo's secrets. Claude writes ai-team/request.json on its branch and pushes; answers land in ai-team/out/
# on the same branch and in the run log. Keys are never printed.
name: ai-team
on:
  push:
    branches-ignore: [main]
    paths: ["ai-team/request.json"]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: "ai-team-${{ github.ref }}", cancel-in-progress: false}
jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ask
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python3 ai-team/ask.py
      - name: Save the answers on this branch
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "ai-team" && git config user.email "ai-team@users.noreply.github.com"
          git add -f ai-team/out && git commit -qm "ai-team: answers" && git pull -q --rebase && git push -q || echo "nothing to save"
