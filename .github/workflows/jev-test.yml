name: jev-test
# Jev (TypeSafe) on history, paper only (Arut 2026-11-13: "подключим Jev"). The key is the repository secret
# TYPESAFE_API_KEY and never leaves this job. It runs the same /s AI tester as the terminal (trend-terminal
# ai_tester.py, rewritten small in jev-test/run.py): SOL daily candles from 2026-06-01, Jev picks long / short / flat each day, compared with holding.
on:
  push:
    branches: [claude/project-thread-74kf6b]
    paths: [.github/workflows/jev-test.yml, jev-test/run.py]
  workflow_dispatch:
    inputs:
      coin: {description: "BTC | ETH | SOL", required: false, default: "SOL"}
permissions: {contents: read}
jobs:
  jev:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      COIN: ${{ inputs.coin || 'SOL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q ccxt==4.5.90
      - name: Jev live check, then daily history
        run: python jev-test/run.py
